# Source of truth for the Xcode project (the .xcodeproj is generated, never committed).
# Regenerate with `xcodegen generate`.
name: EmdashMobile
options:
  bundleIdPrefix: com.morax
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: NU43RNA6U9

packages:
  MoraxDesign:
    url: https://github.com/Etienne-Morax/morax-design.git
    from: 1.1.1

targets:
  EmdashMobile:
    type: application
    platform: iOS
    sources:
      - path: EmdashMobile
    dependencies:
      - package: MoraxDesign
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morax.emdashmobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Emdash
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  EmdashMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EmdashMobileTests]
    dependencies:
      - target: EmdashMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.morax.emdashmobile.tests

schemes:
  EmdashMobile:
    build:
      targets:
        EmdashMobile: all
        EmdashMobileTests: [test]
    test:
      targets: [EmdashMobileTests]
